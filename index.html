<style>
/* ==== کازمالجی ورلد — v2 cosmic design ==== */
:root{
  --bg:#0a0613; --panel:rgba(255,255,255,.045); --panel-brd:rgba(255,255,255,.09);
  --ink:#f5f2ff; --muted:#9a90b8; --faint:#5f5877;
  --red:#ff2d55; --cyan:#22d3ee; --violet:#9d5cff; --yellow:#ffd23f;
  --radius:22px; --maxw:1120px;
  --grad:linear-gradient(135deg,var(--red),var(--violet) 55%,var(--cyan));
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;font-family:"Vazirmatn","Space Grotesk",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.95;overflow-x:hidden}
a{color:inherit;text-decoration:none} img{max-width:100%;display:block}
.cosmic{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(60% 50% at 20% 0%, rgba(157,92,255,.28), transparent 60%),
  radial-gradient(50% 45% at 90% 10%, rgba(34,211,238,.20), transparent 60%),
  radial-gradient(70% 60% at 70% 90%, rgba(255,45,85,.16), transparent 60%), var(--bg);}
.stars{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.7}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.3)}}
header.topbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(10,6,19,.66);border-bottom:1px solid var(--panel-brd)}
.header-inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 22px}
.brand{font-weight:800;font-size:21px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand .dot{width:14px;height:14px;border-radius:50%;background:var(--grad);box-shadow:0 0 14px 2px rgba(157,92,255,.6)}
.brand .brand-url{font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--panel-brd);padding:4px 10px;border-radius:999px;direction:ltr;font-family:"Space Grotesk",monospace}
nav.menu{display:flex;gap:6px;flex-wrap:wrap}
nav.menu a{padding:8px 15px;border-radius:999px;font-weight:600;font-size:14px;color:#d8d2ea;transition:.25s;border:1px solid transparent}
nav.menu a:hover{background:var(--panel);border-color:var(--panel-brd);color:#fff}
nav.menu a.active{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(157,92,255,.4)}
.hero{position:relative;padding:76px 22px 64px;text-align:center;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 120% at 50% -20%, rgba(157,92,255,.25), transparent 55%)}
.hero-inner{max-width:760px;margin:0 auto;position:relative;z-index:2}
.hero .kicker{display:inline-block;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--cyan);border:1px solid var(--panel-brd);background:var(--panel);padding:6px 14px;border-radius:999px;margin-bottom:20px;font-family:"Space Grotesk",monospace}
.hero h1{font-size:clamp(34px,7vw,66px);font-weight:900;margin:0 0 14px;line-height:1.25}
.hero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:640px;margin:0 auto;color:var(--muted);font-size:17px}
.badge-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:26px}
.badge{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:999px;font-weight:600;font-size:14px;background:var(--panel);border:1px solid var(--panel-brd);transition:.25s}
.badge:hover{transform:translateY(-2px);border-color:var(--violet)}
.badge.accent{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(157,92,255,.35)}
main{max-width:var(--maxw);margin:0 auto;padding:18px 22px}
.section-title{display:flex;align-items:baseline;gap:12px;margin:52px 4px 22px;font-size:27px;font-weight:800}
.section-title::before{content:"";align-self:center;width:9px;height:28px;border-radius:6px;background:var(--grad);box-shadow:0 0 14px rgba(157,92,255,.6)}
.section-title small{font-size:13px;font-weight:500;color:var(--faint)}
.article{background:var(--panel);border:1px solid var(--panel-brd);border-radius:var(--radius);overflow:hidden;margin:20px 0;display:grid;grid-template-columns:360px 1fr;box-shadow:0 20px 50px rgba(0,0,0,.35);transition:transform .3s,border-color .3s}
.article:hover{transform:translateY(-4px);border-color:rgba(157,92,255,.5)}
.article .media{position:relative;background:#05030c;overflow:hidden}
.article .media img{width:100%;height:100%;min-height:300px;object-fit:cover;transition:transform .6s ease}
.article:hover .media img{transform:scale(1.06)}
.article .media::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 55%,rgba(10,6,19,.55))}
.article .media .tag{position:absolute;top:14px;right:14px;z-index:2;background:var(--grad);color:#fff;font-weight:800;font-size:12px;padding:6px 13px;border-radius:999px;box-shadow:0 6px 16px rgba(157,92,255,.45)}
.article .body{padding:28px 30px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.article .meta{color:var(--cyan);font-size:13px;font-weight:700}
.article h2{margin:0;font-size:24px;font-weight:800;line-height:1.4}
.article p{margin:0;color:var(--muted);font-size:15.5px}
.archive{display:inline-flex;align-items:center;gap:10px;margin-top:8px;background:var(--grad);color:#fff;font-weight:800;font-size:15px;padding:13px 22px;border-radius:14px;box-shadow:0 10px 24px rgba(157,92,255,.4);transition:transform .2s,box-shadow .2s;align-self:flex-start}
.archive:hover{transform:translateY(-2px)}
.archive svg{width:20px;height:20px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin:16px 0}
.g-item{position:relative;background:var(--panel);border:1px solid var(--panel-brd);border-radius:var(--radius);overflow:hidden;transition:transform .3s,border-color .3s}
.g-item:hover{transform:translateY(-5px);border-color:rgba(34,211,238,.55)}
.g-item img{width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .6s ease}
.g-item:hover img{transform:scale(1.08)}
.g-item .cap{position:absolute;inset:auto 0 0 0;padding:44px 18px 16px;background:linear-gradient(transparent,rgba(5,3,12,.9))}
.g-item .cap h3{margin:0 0 4px;font-size:16px;font-weight:800}
.g-item .cap a{font-size:13px;font-weight:700;color:var(--cyan)}
footer{background:rgba(5,3,12,.7);border-top:1px solid var(--panel-brd);color:var(--muted);margin-top:60px;padding:38px 22px;font-size:14px}
.footer-inner{max-width:var(--maxw);margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px}
footer a{color:var(--cyan);font-weight:600}
@media(max-width:760px){.article{grid-template-columns:1fr}.article .media img{min-height:220px}nav.menu{justify-content:center}.header-inner{flex-direction:column}}
</style>
</head>
<body>
<div class="cosmic"></div>
<div class="stars" id="stars"></div>
<header class="topbar">
  <div class="header-inner">
    <div class="brand" id="brand"></div>
    <nav class="menu">
      <a href="#home" class="active">خانه</a>
      <a href="#articles">مقالات</a>
      <a href="#gallery">گالری</a>
      <a id="navTg" target="_blank" rel="noopener">آرشیو تلگرام ↗</a>
    </nav>
  </div>
</header>
<section class="hero" id="home">
  <div class="hero-inner">
    <span class="kicker">COSMOLOGICAL • COMIC • ART</span>
    <h1 id="heroTitle"></h1>
    <p id="heroSub"></p>
    <div class="badge-row" id="badges"></div>
  </div>
</section>
<main id="articles">
  <h2 class="section-title">مقالات <small>تحلیل و نثر</small></h2>
  <div id="articlesList"></div>
  <h2 class="section-title" id="gallery">گالری <small>اثرهای بصری</small></h2>
  <div class="gallery" id="galleryList"></div>
</main>
<footer>
  <div class="footer-inner">
    <div id="footerRights"></div>
    <div>لینک اثرها: <a id="footerTg" target="_blank" rel="noopener">آرشیو تلگرام ↗</a></div>
  </div>
</footer>
<script>
(function(){
  const box=document.getElementById('stars'); let html='';
  for(let i=0;i<70;i++){
    const x=Math.random()*100,y=Math.random()*100,d=Math.random()*3,s=(Math.random()*1.5+0.5).toFixed(1);
    html+='<i style="left:'+x+'%;top:'+y+'%;animation-delay:'+d+'s;width:'+s+'px;height:'+s+'px"></i>';
  }
  box.innerHTML=html;
})();
const FALLBACK = {"site":{"title":"کازمالجی ورلد — دنیای کمیک و هنر","brand":"کازمالجی ورلد","brandUrl":"www.thecosmologicalworld.ir","heroTitle":"دنیای **کمیک**، انیمه و هنر — به فارسی","heroSub":"کازمالجی ورلد؛ جایی برای نوشتن، معرفی و مرور دنیای کمیک و هنر.","telegram":{"url":"https://t.me/Thecosmologicalworldarchive","label":"آرشیو تلگرام","buttonLabel":"باز کردن در آرشیو تلگرام"},"footerRights":"کازمالجی ورلد — thecosmologicalworld.ir","footerYear":"۲۰۲۶"},"articles":[],"gallery":[]};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function bold(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<span>$1</span>');}
function render(d){
  const s = d.site||{}; const tg = s.telegram||{};
  document.title = s.title||'کازمالجی ورلد';
  document.getElementById('brand').innerHTML =
    '<span class="dot"></span>'+esc(s.brand||'کازمالجی ورلد')+
    (s.brandUrl?' <span class="brand-url">'+esc(s.brandUrl)+'</span>':'');
  const nt=document.getElementById('navTg'); nt.href=tg.url||'#'; nt.textContent=(tg.label||'آرشیو تلگرام')+' ↗';
  const ft=document.getElementById('footerTg'); ft.href=tg.url||'#'; ft.textContent=(tg.label||'آرشیو تلگرام')+' ↗';
  document.getElementById('heroTitle').innerHTML = bold(s.heroTitle||'');
  document.getElementById('heroSub').textContent = s.heroSub||'';
  document.getElementById('badges').innerHTML =
    (tg.url?'<a class="badge accent" href="'+esc(tg.url)+'" target="_blank" rel="noopener">'+esc(s.brand||'')+' — آرشیو تلگرام ↗</a>':'') +
    '<span class="badge">مقالات</span>'+'<span class="badge">گالری</span>';
  document.getElementById('articlesList').innerHTML = (d.articles||[]).map(a=>
    '<article class="article">'+
      '<div class="media">'+(a.tag?'<span class="tag">'+esc(a.tag)+'</span>':'')+
        '<img src="'+esc(a.image||'')+'" alt="'+esc(a.title||'')+'" loading="lazy"></div>'+
      '<div class="body">'+
        (a.meta?'<div class="meta">'+esc(a.meta)+'</div>':'')+
        '<h2>'+esc(a.title||'')+'</h2>'+
        (a.body||'').split('\n').filter(Boolean).map(p=>'<p>'+esc(p)+'</p>').join('')+
        (a.link?'<a class="archive" href="'+esc(a.link)+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M9 7h8v8" stroke-linecap="round" stroke-linejoin="round"/></svg>'+esc(a.linkLabel||tg.buttonLabel||'باز کردن')+'</a>':'')+
      '</div>'+'</article>').join('');
  document.getElementById('galleryList').innerHTML = (d.gallery||[]).map(g=>
    '<div class="g-item"><img src="'+esc(g.image||'')+'" alt="" loading="lazy">'+
      '<div class="cap"><h3>'+esc(g.title||'')+'</h3>'+
      (g.link?'<a href="'+esc(g.link)+'" target="_blank" rel="noopener">'+esc(g.linkLabel||tg.label||'آرشیو تلگرام')+' ↗</a>':'')+
      '</div></div>').join('');
  document.getElementById('footerRights').innerHTML =
    '© '+(s.footerYear||'')+' <strong>'+esc(s.brand||'')+'</strong> — '+
    (s.footerRights?'<a href="'+esc((s.brandUrl&&/^https?:/i.test(s.brandUrl)?s.brandUrl:'https://'+s.brandUrl).replace(/^https?:\/\//,''))+'">'+esc(s.footerRights)+'</a>':'');
}
fetch('site.json',{cache:'no-store'})
  .then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(render)
  .catch(()=>render(FALLBACK));
</script>
</body>
</html>
