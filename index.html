<!doctype html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کازمالجی ورلد — دنیای کمیک و هنر</title>
<meta name="description" content="کازمالجی ورلد؛ مجله‌ی فارسی کمیک، انیمه و هنر. مقالات، گالری و آرشیو تلگرام.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
/* ==== کازمالجی ورلد — appearance (rendered from site.json via the admin panel) ==== */
:root{
  --ink:#14101f; --paper:#f6f2ea; --panel:#fff;
  --red:#e4002b; --blue:#2f5fe0; --yellow:#ffd23f; --violet:#7a3ff0;
  --muted:#6b6577; --radius:18px; --shadow:0 12px 30px rgba(20,16,31,.12); --maxw:1080px;
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;font-family:"Vazirmatn","IRANSans","Segoe UI",Tahoma,sans-serif;background:var(--paper);color:var(--ink);line-height:1.9}
a{color:inherit;text-decoration:none} img{max-width:100%;display:block}
header.topbar{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff}
.header-inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 20px}
.brand{font-weight:800;font-size:22px;letter-spacing:.3px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand .brand-url{font-size:12px;font-weight:600;color:#b7a8dd;border:1px solid rgba(255,255,255,.2);padding:4px 10px;border-radius:999px}
.brand .dot{width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(228,0,43,.25)}
nav.menu{display:flex;gap:8px;flex-wrap:wrap}
nav.menu a{padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;color:#efeaf7;transition:.2s}
nav.menu a:hover{background:#241d33;color:#fff}
nav.menu a.active{background:var(--red);color:#fff}
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 85% 10%, #2a1f45 0%, var(--ink) 55%);color:#fff;padding:56px 20px 64px}
.hero-inner{max-width:var(--maxw);margin:0 auto;position:relative;z-index:2}
.hero h1{font-size:clamp(30px,6vw,54px);font-weight:800;margin:0 0 10px;line-height:1.3}
.hero h1 span{color:var(--yellow)}
.hero p{max-width:640px;color:#cfc8e2;font-size:17px}
.badge-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.badge{display:inline-block;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
.badge.accent{background:var(--red);border-color:transparent}
main{max-width:var(--maxw);margin:0 auto;padding:20px}
.section-title{display:flex;align-items:center;gap:12px;margin:38px 4px 18px;font-size:26px;font-weight:800}
.section-title::before{content:"";width:8px;height:26px;border-radius:6px;background:var(--blue)}
.article{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin:18px 0;display:grid;grid-template-columns:340px 1fr}
.article .media{position:relative;background:#0e0b16}
.article .media img{width:100%;height:100%;min-height:280px;object-fit:cover}
.article .media .tag{position:absolute;top:14px;right:14px;background:var(--yellow);color:#201800;font-weight:800;font-size:12px;padding:6px 12px;border-radius:999px}
.article .body{padding:24px 26px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.article .meta{color:var(--muted);font-size:13px;font-weight:600}
.article h2{margin:0;font-size:23px;font-weight:800;line-height:1.4}
.article p{margin:0;color:#3a3350}
.archive{display:inline-flex;align-items:center;gap:10px;margin-top:6px;background:linear-gradient(90deg,var(--red),var(--violet));color:#fff;font-weight:800;font-size:15px;padding:13px 20px;border-radius:14px;box-shadow:0 8px 18px rgba(228,0,43,.28);transition:transform .15s,box-shadow .15s;align-self:flex-start}
.archive:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(228,0,43,.38)}
.archive svg{width:20px;height:20px;flex:none}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin:14px 0}
.gallery .g-item{background:var(--panel);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.gallery .g-item img{width:100%;aspect-ratio:4/3;object-fit:cover}
.gallery .g-item .cap{padding:14px 16px}
.gallery .g-item .cap h3{margin:0 0 4px;font-size:16px;font-weight:800}
.gallery .g-item .cap a{font-size:13px;font-weight:700;color:var(--red);display:inline-block;margin-top:6px}
.gallery .g-item .cap a:hover{text-decoration:underline}
footer{background:var(--ink);color:#cfc8e2;margin-top:50px;padding:34px 20px;font-size:14px}
.footer-inner{max-width:var(--maxw);margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
footer a{color:var(--yellow);font-weight:600}
@media(max-width:760px){.article{grid-template-columns:1fr}.article .media img{min-height:220px}nav.menu{justify-content:center}.header-inner{flex-direction:column}}
</style>
</head>
<body>

<header class="topbar">
  <div class="header-inner">
    <div class="brand" id="brand"></div>
    <nav class="menu">
      <a href="#home" class="active">خانه</a>
      <a href="#articles">مقالات</a>
      <a href="#gallery">گالری</a>
      <a id="navTg" target="_blank" rel="noopener">آرشیو تلگرام ↗</a>
    </nav>
  </div>
</header>

<section class="hero" id="home">
  <div class="hero-inner">
    <h1 id="heroTitle"></h1>
    <p id="heroSub"></p>
    <div class="badge-row" id="badges"></div>
  </div>
</section>

<main id="articles">
  <h2 class="section-title">مقالات</h2>
  <div id="articlesList"></div>
  <h2 class="section-title" id="gallery">گالری</h2>
  <div class="gallery" id="galleryList"></div>
</main>

<footer>
  <div class="footer-inner">
    <div id="footerRights"></div>
    <div>لینک اثرها: <a id="footerTg" target="_blank" rel="noopener">آرشیو تلگرام ↗</a></div>
  </div>
</footer>

<script>
/* Fallback content (used if site.json is unavailable) */
const FALLBACK = {"site":{"title":"کازمالجی ورلد — دنیای کمیک و هنر","description":"کازمالجی ورلد؛ مجله‌ی فارسی کمیک، انیمه و هنر.","brand":"کازمالجی ورلد","brandUrl":"www.thecosmologicalworld.ir","heroTitle":"دنیای **کمیک**، انیمه و هنر — به فارسی","heroSub":"کازمالجی ورلد؛ جایی برای نوشتن، معرفی و مرور دنیای کمیک و هنر.","telegram":{"url":"https://t.me/Thecosmologicalworldarchive","label":"آرشیو تلگرام","buttonLabel":"باز کردن در آرشیو تلگرام"},"footerRights":"کازمالجی ورلد — thecosmologicalworld.ir","footerYear":"۲۰۲۶"},"articles":[],"gallery":[]};

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function bold(s){ /* **x** -> <span>x</span> (for yellow hero word) */
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<span>$1</span>');
}

function render(d){
  const s = d.site||{};
  const tg = s.telegram||{};
  document.title = s.title||'کازمالجی ورلد';
  document.getElementById('brand').innerHTML =
    '<span class="dot"></span>'+esc(s.brand||'کازمالجی ورلد')+
    (s.brandUrl?' <span class="brand-url">'+esc(s.brandUrl)+'</span>':'');
  const nt=document.getElementById('navTg'); nt.href=tg.url||'#'; nt.textContent=(tg.label||'آرشیو تلگرام')+' ↗';
  const ft=document.getElementById('footerTg'); ft.href=tg.url||'#'; ft.textContent=(tg.label||'آرشیو تلگرام')+' ↗';
  document.getElementById('heroTitle').innerHTML = bold(s.heroTitle||'');
  document.getElementById('heroSub').textContent = s.heroSub||'';
  document.getElementById('badges').innerHTML =
    (tg.url?'<a class="badge accent" href="'+esc(s.brandUrl||'#')+'" target="_blank" rel="noopener">'+esc(s.brand||'')+' — '+(s.brandUrl||'')+'</a>':'') +
    '<span class="badge">مقالات</span>' +
    '<span class="badge">گالری</span>' +
    (tg.url?'<a class="badge" href="'+esc(tg.url)+'" target="_blank" rel="noopener">'+esc(tg.label||'آرشیو تلگرام')+' ↗</a>':'');
  document.getElementById('articlesList').innerHTML = (d.articles||[]).map(a=>
    '<article class="article">'+
      '<div class="media">'+(a.tag?'<span class="tag">'+esc(a.tag)+'</span>':'')+
        '<img src="'+esc(a.image||'')+'" alt="'+esc(a.title||'')+'"></div>'+
      '<div class="body">'+
        (a.meta?'<div class="meta">'+esc(a.meta)+'</div>':'')+
        '<h2>'+esc(a.title||'')+'</h2>'+
        (a.body||'').split('\n').filter(Boolean).map(p=>'<p>'+esc(p)+'</p>').join('')+
        (a.link?'<a class="archive" href="'+esc(a.link)+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M9 7h8v8" stroke-linecap="round" stroke-linejoin="round"/></svg>'+esc(a.linkLabel||tg.buttonLabel||'باز کردن')+'</a>':'')+
      '</div>'+
    '</article>').join('');
  document.getElementById('galleryList').innerHTML = (d.gallery||[]).map(g=>
    '<div class="g-item"><img src="'+esc(g.image||'')+'" alt="">'+
      '<div class="cap"><h3>'+esc(g.title||'')+'</h3>'+
      (g.link?'<a href="'+esc(g.link)+'" target="_blank" rel="noopener">'+esc(g.linkLabel||tg.label||'آرشیو تلگرام')+' ↗</a>':'')+
      '</div></div>').join('');
  document.getElementById('footerRights').innerHTML =
    '© '+(s.footerYear||'')+' <strong>'+esc(s.brand||'')+'</strong> — '+
    (s.footerRights?'<a href="'+esc((s.brandUrl&&/^https?:/i.test(s.brandUrl)?s.brandUrl:'https://'+s.brandUrl).replace(/^https?:\/\//,''))+'">'+esc(s.footerRights)+'</a>':'');
}

fetch('site.json',{cache:'no-store'})
  .then(r=>{ if(!r.ok) throw 0; return r.json(); })
  .then(render)
  .catch(()=>render(FALLBACK));
</script>

</body>
</html>
